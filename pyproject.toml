[project]
name = "solomon2026"
version = "2026.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "brotli>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
solomon = "solomon.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PYI", "FURB"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Depends",
    "typer.Argument",
    "typer.Option",
]
