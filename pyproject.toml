[project]
name = "solomon2026"
version = "2026.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "brotli>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
solomon = "solomon.cli:app"
